name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint and format
        run: npx biome check .

      - name: House style
        run: ./scripts/check-dashes.sh

      - name: Types
        run: npx tsc --noEmit

      - name: Dependency audit
        # Advisory. A new advisory against a transitive dependency should be
        # visible without blocking an unrelated change.
        run: npm audit --audit-level=high || true

      - name: Build
        run: npm run build

      - name: Bundle budget
        run: node scripts/check-bundle.mjs

  publish:
    # Only after everything has passed, and only from main. A tag that exists
    # for a commit that failed its checks is a tag someone will eventually
    # deploy.
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/0xask-frontend
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            NEXT_PUBLIC_SITE_ORIGIN=${{ vars.SITE_ORIGIN }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Layers are cached in the registry, so an unchanged dependency layer
          # is not rebuilt on every push.
          cache-from: type=gha
          cache-to: type=gha,mode=max
